<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApplySafe - Debug Scan History</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .section {
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
        }
        
        .section h2 {
            color: #2563eb;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        button:hover {
            background: #1d4ed8;
        }
        
        .storage-view {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .log {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-left: 4px solid #2563eb;
            border-radius: 2px;
        }
        
        .log.success {
            background: #d1fae5;
            border-left-color: #10b981;
        }
        
        .log.error {
            background: #fee2e2;
            border-left-color: #ef4444;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .stat-box {
            background: #f0f9ff;
            border: 1px solid #e0f2fe;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .scan-item {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
        }
        
        .scan-title {
            font-weight: bold;
            color: #333;
        }
        
        .scan-detail {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 ApplySafe - Scan History Debug</h1>
        
        <div class="section">
            <h2>Storage Data</h2>
            <button onclick="viewStorage()">View recentScans</button>
            <button onclick="viewAllStorage()">View All Storage</button>
            <button onclick="clearStorage()">Clear recentScans</button>
            <button onclick="createTestScan()">Create Test Scan</button>
            <div id="storageView" class="storage-view">Click a button to view data...</div>
        </div>
        
        <div class="section">
            <h2>Statistics</h2>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-value" id="scanCount">0</div>
                    <div class="stat-label">Total Scans</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="storageSize">0 KB</div>
                    <div class="stat-label">Storage Used</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="lastScan">Never</div>
                    <div class="stat-label">Last Scan</div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>Parsed Scans</h2>
            <div id="scansView">No scans yet</div>
        </div>
        
        <div class="section">
            <h2>Logs</h2>
            <div id="logs"></div>
        </div>
    </div>

    <script>
        function addLog(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const log = document.createElement('div');
            log.className = `log ${type}`;
            log.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(log);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function formatJSON(obj) {
            return JSON.stringify(obj, null, 2);
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'Unknown';
            return new Date(parseInt(timestamp)).toLocaleString();
        }

        async function viewStorage() {
            try {
                const data = await chrome.storage.local.get(['recentScans']);
                const view = document.getElementById('storageView');
                view.textContent = formatJSON(data);
                addLog('Loaded recentScans from storage', 'success');
                
                // Update stats
                const scans = data.recentScans || [];
                document.getElementById('scanCount').textContent = scans.length;
                
                if (scans.length > 0) {
                    const lastScan = scans[0];
                    document.getElementById('lastScan').textContent = formatDate(lastScan.timestamp);
                }
                
                // Parse and display scans
                const scansView = document.getElementById('scansView');
                if (scans.length === 0) {
                    scansView.innerHTML = '<p>No scans in storage</p>';
                } else {
                    scansView.innerHTML = scans.map((scan, i) => `
                        <div class="scan-item">
                            <div class="scan-title">${i + 1}. ${scan.jobTitle || 'Unknown Job'}</div>
                            <div class="scan-detail"><strong>Company:</strong> ${scan.company || 'Unknown'}</div>
                            <div class="scan-detail"><strong>Risk Score:</strong> ${scan.riskScore || 'N/A'}</div>
                            <div class="scan-detail"><strong>Timestamp:</strong> ${formatDate(scan.timestamp)}</div>
                            <div class="scan-detail"><strong>URL:</strong> ${scan.url || 'N/A'}</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                addLog(`Error viewing storage: ${error.message}`, 'error');
                document.getElementById('storageView').textContent = `Error: ${error.message}`;
            }
        }

        async function viewAllStorage() {
            try {
                const data = await chrome.storage.local.get(null);
                const view = document.getElementById('storageView');
                view.textContent = formatJSON(data);
                addLog('Loaded all storage', 'success');
            } catch (error) {
                addLog(`Error viewing all storage: ${error.message}`, 'error');
            }
        }

        async function clearStorage() {
            try {
                await chrome.storage.local.remove(['recentScans']);
                addLog('Cleared recentScans', 'success');
                document.getElementById('scanCount').textContent = '0';
                document.getElementById('storageView').textContent = 'Storage cleared';
                document.getElementById('scansView').innerHTML = '<p>No scans</p>';
            } catch (error) {
                addLog(`Error clearing storage: ${error.message}`, 'error');
            }
        }

        async function createTestScan() {
            try {
                const testScan = {
                    jobTitle: 'Senior Software Engineer',
                    company: 'Apple Inc.',
                    url: 'https://jobs.apple.com/test-job',
                    riskScore: 15,
                    timestamp: Date.now()
                };
                
                const data = await chrome.storage.local.get(['recentScans']);
                let scans = data.recentScans || [];
                scans.unshift(testScan);
                scans = scans.slice(0, 50);
                
                await chrome.storage.local.set({ recentScans: scans });
                addLog(`Created test scan (Total: ${scans.length})`, 'success');
                
                // Refresh view
                setTimeout(viewStorage, 100);
            } catch (error) {
                addLog(`Error creating test scan: ${error.message}`, 'error');
            }
        }

        // Load on startup
        window.addEventListener('load', () => {
            addLog('Debug page loaded', 'success');
            viewStorage();
        });
    </script>
</body>
</html>
