<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplySafe - Redirecting to Dashboard</title>
  <style>
    body {
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(197, 164, 109, 0.18), transparent 32%),
        radial-gradient(circle at top right, rgba(30, 106, 85, 0.14), transparent 28%),
        linear-gradient(180deg, #fbf7ef 0%, #f7f0e7 42%, #f2eadf 100%);
    }
    .loading {
      text-align: center;
      padding: 28px 32px;
      border-radius: 24px;
      background: rgba(255, 251, 245, 0.9);
      border: 1px solid rgba(34, 40, 36, 0.12);
      box-shadow: 0 24px 60px rgba(63, 45, 28, 0.14);
      backdrop-filter: blur(16px);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e5e7eb;
      border-top-color: #1e6a55;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      color: #1f2420;
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>Opening your extension dashboard...</p>
  </div>
  <script src="redirect.js"></script>
</body>
</html>
