<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to ApplySafe Pro!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(77, 183, 255, 0.22), transparent 34%),
        radial-gradient(circle at top right, rgba(23, 215, 192, 0.16), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, #edf5ff 42%, #dfeeff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .success-container {
      background: rgba(248, 252, 255, 0.9);
      border: 1px solid rgba(15, 47, 115, 0.12);
      border-radius: 28px;
      padding: 60px 40px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 24px 60px rgba(22, 66, 132, 0.16);
      backdrop-filter: blur(16px);
    }

    .checkmark {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #12377f 0%, #17d7c0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.5s ease-out;
      box-shadow: 0 14px 28px rgba(22, 66, 132, 0.18);
    }

    .checkmark svg {
      width: 50px;
      height: 50px;
      stroke: white;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawCheck 0.8s ease-out 0.3s forwards;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }

    @keyframes drawCheck {
      to {
        stroke-dashoffset: 0;
      }
    }

    h1 {
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-size: 2.4rem;
      letter-spacing: -0.04em;
      color: #10306f;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1rem;
      color: #5f7a9b;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .features {
      text-align: left;
      margin: 30px 0;
      padding: 20px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(15, 47, 115, 0.08);
      border-radius: 18px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .feature:last-child {
      margin-bottom: 0;
    }

    .feature-icon {
      width: 10px;
      height: 10px;
      background: #17d7c0;
      border-radius: 50%;
      display: block;
      flex-shrink: 0;
    }

    .feature-text {
      color: #2f557d;
      font-size: 0.95rem;
    }

    .close-btn {
      background: #10306f;
      color: #eff7ff;
      border: none;
      padding: 14px 32px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .close-btn:hover {
      background: #0a1f51;
      transform: translateY(-2px);
      box-shadow: 0 14px 24px rgba(10, 26, 71, 0.18);
    }
  </style>
</head>
<body>
  <div class="success-container">
    <div class="checkmark">
      <svg viewBox="0 0 50 50">
        <path d="M10 25 L20 35 L40 15" />
      </svg>
    </div>

    <h1>ApplySafe Pro is ready.</h1>
    <p id="status">Your subscription is active and the extension now has full access to premium review features.</p>

    <div class="features">
      <div class="feature">
        <div class="feature-icon" aria-hidden="true"></div>
        <div class="feature-text">Unlimited listing reviews each day</div>
      </div>
      <div class="feature">
        <div class="feature-icon" aria-hidden="true"></div>
        <div class="feature-text">H-1B sponsorship verification</div>
      </div>
      <div class="feature">
        <div class="feature-icon" aria-hidden="true"></div>
        <div class="feature-text">Full scan history and trend tracking</div>
      </div>
      <div class="feature">
        <div class="feature-icon" aria-hidden="true"></div>
        <div class="feature-text">Priority support for account issues</div>
      </div>
    </div>

    <button class="close-btn" id="closeSuccessBtn">Return to the extension</button>
  </div>

  <script src="success.js"></script>
</body>
</html>
