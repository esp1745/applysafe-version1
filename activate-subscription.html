<!DOCTYPE html>
<html>
<head>
  <title>Activate ApplySafe Subscription</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      text-align: center;
    }
    h1 {
      color: #111827;
      margin-bottom: 20px;
    }
    p {
      color: #6b7280;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-weight: 500;
    }
    .success {
      background: #d1fae5;
      color: #065f46;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 Activate Your Subscription</h1>
    <p>You've already completed payment. Click the button below to activate unlimited scans in your ApplySafe extension.</p>
    <button onclick="activateNow()">Activate Subscription Now</button>
    <div id="status"></div>
  </div>

  <script>
    async function activateNow() {
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = 'Activating...';
      statusDiv.className = 'status';
      
      try {
        // Send message to extension to activate subscription
        // Using a dummy customer ID for test mode
        const customerId = 'cus_test_' + Date.now();
        
        const response = await chrome.runtime.sendMessage({
          action: 'activateSubscription',
          customerId: customerId,
          sessionId: 'manual_activation'
        });
        
        if (response && response.success) {
          statusDiv.textContent = '✓ Subscription activated! You now have unlimited scans. Close this page and open the extension.';
          statusDiv.className = 'status success';
        } else {
          throw new Error(response?.error || 'Activation failed');
        }
      } catch (error) {
        statusDiv.textContent = '✗ Error: ' + error.message + '. Try reloading the extension at chrome://extensions';
        statusDiv.className = 'status error';
      }
    }
  </script>
</body>
</html>
