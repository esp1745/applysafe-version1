<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApplySafe - Scan History Diagnostic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button.danger {
            background: #ef4444;
        }
        
        button.danger:hover {
            background: #dc2626;
        }
        
        .data-view {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 15px;
            margin-top: 10px;
            max-height: 500px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .scan-item {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin: 10px 0;
            border-radius: 4px;
        }
        
        .scan-item h3 {
            color: #333;
            margin: 0 0 5px 0;
            font-size: 14px;
        }
        
        .scan-detail {
            color: #666;
            font-size: 12px;
            margin: 3px 0;
        }
        
        .stat {
            display: inline-block;
            background: #f0f7ff;
            border: 1px solid #667eea;
            padding: 10px 15px;
            border-radius: 4px;
            margin: 5px 5px 5px 0;
        }
        
        .stat-value {
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        
        .success {
            background: #d1fae5;
            border-left-color: #10b981;
        }
        
        .error {
            background: #fee2e2;
            border-left-color: #ef4444;
        }
        
        .warning {
            background: #fef3c7;
            border-left-color: #f59e0b;
        }
        
        .log {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            border-left: 4px solid #999;
            background: #f5f5f5;
        }
        
        .log.info {
            border-left-color: #3b82f6;
            background: #eff6ff;
        }
        
        .log.success {
            border-left-color: #10b981;
            background: #f0fdf4;
        }
        
        .log.error {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 ApplySafe - Scan History Diagnostic</h1>
            <p>Debug tool to understand scan history data flow</p>
        </div>
        
        <div class="section">
            <h2>📊 Storage Overview</h2>
            <div class="button-group">
                <button onclick="checkStorage()">Check Storage</button>
                <button onclick="syncWithPopup()">Sync from Popup Storage</button>
                <button onclick="testCreateScan()">Test Create Scan</button>
                <button class="danger" onclick="clearAllData()">Clear All Data</button>
            </div>
            <div id="storageStats"></div>
        </div>
        
        <div class="section">
            <h2>📝 Recent Scans</h2>
            <div id="scansList"></div>
        </div>
        
        <div class="section">
            <h2>🔧 Raw Storage Data</h2>
            <div class="button-group">
                <button onclick="viewRawStorage('recentScans')">View recentScans</button>
                <button onclick="viewRawStorage('scanHistory')">View scanHistory</button>
                <button onclick="viewAllStorage()">View All Storage</button>
            </div>
            <div id="rawStorage" class="data-view">Click a button to view data...</div>
        </div>
        
        <div class="section">
            <h2>📋 Logs</h2>
            <div id="logs"></div>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function formatJSON(obj) {
            return JSON.stringify(obj, null, 2);
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'Unknown';
            return new Date(parseInt(timestamp)).toLocaleString();
        }

        async function checkStorage() {
            try {
                const data = await chrome.storage.local.get(['recentScans', 'stats', 'applications', 'reminders']);
                
                log(`Storage check: Found ${Object.keys(data).length} keys`, 'info');
                
                const scans = data.recentScans || [];
                const stats = data.stats || {};
                
                let html = `
                    <div class="stat">
                        <div class="stat-value">${scans.length}</div>
                        <div class="stat-label">Recent Scans</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${stats.jobsScanned || 0}</div>
                        <div class="stat-label">Total Analyzed</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${stats.scamsBlocked || 0}</div>
                        <div class="stat-label">Threats Blocked</div>
                    </div>
                `;
                
                if (scans.length > 0) {
                    const lastScan = scans[0];
                    html += `
                        <div class="stat">
                            <div class="stat-value">Now</div>
                            <div class="stat-label">Last Scan: ${formatDate(lastScan.timestamp)}</div>
                        </div>
                    `;
                }
                
                document.getElementById('storageStats').innerHTML = html;
                
                // Display scans
                if (scans.length === 0) {
                    document.getElementById('scansList').innerHTML = '<div class="log warning">No scans found in storage</div>';
                } else {
                    const scansHtml = scans.slice(0, 10).map((scan, i) => `
                        <div class="scan-item">
                            <h3>${i + 1}. ${scan.jobTitle || 'Unknown Job'}</h3>
                            <div class="scan-detail"><strong>Company:</strong> ${scan.company || 'Unknown'}</div>
                            <div class="scan-detail"><strong>Risk Score:</strong> ${scan.riskScore || 'N/A'}</div>
                            <div class="scan-detail"><strong>Timestamp:</strong> ${formatDate(scan.timestamp)}</div>
                            <div class="scan-detail"><strong>URL:</strong> ${scan.url || 'N/A'}</div>
                        </div>
                    `).join('');
                    document.getElementById('scansList').innerHTML = scansHtml;
                }
                
                log(`Loaded ${scans.length} scans from storage`, 'success');
            } catch (error) {
                log(`Error checking storage: ${error.message}`, 'error');
                document.getElementById('storageStats').innerHTML = `<div class="log error">Error: ${error.message}</div>`;
            }
        }

        async function viewRawStorage(key) {
            try {
                const data = await chrome.storage.local.get([key]);
                document.getElementById('rawStorage').textContent = formatJSON(data[key] || `Key "${key}" not found`);
                log(`Viewed ${key}`, 'info');
            } catch (error) {
                log(`Error viewing ${key}: ${error.message}`, 'error');
                document.getElementById('rawStorage').textContent = `Error: ${error.message}`;
            }
        }

        async function viewAllStorage() {
            try {
                const data = await chrome.storage.local.get(null);
                document.getElementById('rawStorage').textContent = formatJSON(data);
                log(`Viewed all storage (${Object.keys(data).length} keys)`, 'info');
            } catch (error) {
                log(`Error viewing all storage: ${error.message}`, 'error');
            }
        }

        async function testCreateScan() {
            try {
                const testScan = {
                    jobTitle: 'TEST - Senior Software Engineer',
                    company: 'Test Corp',
                    url: 'https://test.com/job-' + Date.now(),
                    riskScore: Math.floor(Math.random() * 100),
                    timestamp: Date.now()
                };
                
                const data = await chrome.storage.local.get(['recentScans']);
                let scans = data.recentScans || [];
                scans.unshift(testScan);
                scans = scans.slice(0, 50);
                
                await chrome.storage.local.set({ recentScans: scans });
                log(`Created test scan (Total: ${scans.length})`, 'success');
                
                setTimeout(checkStorage, 100);
            } catch (error) {
                log(`Error creating test scan: ${error.message}`, 'error');
            }
        }

        async function syncWithPopup() {
            try {
                // This attempts to mimic what the dashboard does
                log('Attempting to sync with popup storage...', 'info');
                const data = await chrome.storage.local.get(['recentScans']);
                if (data.recentScans) {
                    log(`Found ${data.recentScans.length} scans in popup storage`, 'success');
                    setTimeout(checkStorage, 100);
                } else {
                    log('No recentScans found in storage', 'warning');
                }
            } catch (error) {
                log(`Error syncing: ${error.message}`, 'error');
            }
        }

        async function clearAllData() {
            if (!confirm('Clear all scan data? This cannot be undone.')) return;
            
            try {
                await chrome.storage.local.remove(['recentScans', 'scanHistory']);
                log('Cleared all scan data', 'success');
                document.getElementById('storageStats').innerHTML = '';
                document.getElementById('scansList').innerHTML = '';
                checkStorage();
            } catch (error) {
                log(`Error clearing data: ${error.message}`, 'error');
            }
        }

        // Load on startup
        window.addEventListener('load', () => {
            log('Diagnostic page loaded', 'success');
            checkStorage();
        });
    </script>
</body>
</html>
