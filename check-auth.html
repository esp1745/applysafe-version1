<!DOCTYPE html>
<html>
<head>
  <title>Check Auth Status</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>ApplySafe Auth Status</h1>
  <button onclick="checkAuth()">Check Auth</button>
  <button onclick="checkStorage()">Check Storage</button>
  <button onclick="testSync()">Test Sync</button>
  <pre id="output"></pre>

  <script>
    const output = document.getElementById('output');
    
    async function checkAuth() {
      try {
        const response = await chrome.runtime.sendMessage({ action: 'getAuthStatus' });
        output.textContent = JSON.stringify(response, null, 2);
      } catch (error) {
        output.textContent = 'Error: ' + error.message;
      }
    }
    
    async function checkStorage() {
      const result = await chrome.storage.local.get(['authToken', 'user', 'subscription']);
      output.textContent = JSON.stringify({
        hasAuthToken: !!result.authToken,
        authTokenPreview: result.authToken ? result.authToken.substring(0, 20) + '...' : null,
        user: result.user,
        subscription: result.subscription
      }, null, 2);
    }
    
    async function testSync() {
      try {
        output.textContent = 'Syncing...';
        const response = await chrome.runtime.sendMessage({ 
          action: 'syncToCloud',
          applications: [],
          reminders: [],
          scanHistory: []
        });
        output.textContent = JSON.stringify(response, null, 2);
      } catch (error) {
        output.textContent = 'Error: ' + error.message;
      }
    }
  </script>
</body>
</html>
