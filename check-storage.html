<!DOCTYPE html>
<html>
<head>
  <title>Check Storage</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    pre { background: white; padding: 15px; border-radius: 5px; border: 1px solid #ddd; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #4285f4; color: white; border: none; border-radius: 4px; }
    button:hover { background: #3367d6; }
    .section { margin: 20px 0; }
    h2 { color: #333; }
  </style>
</head>
<body>
  <h1>Storage Debug</h1>
  
  <div class="section">
    <h2>Check Auth Storage</h2>
    <button onclick="checkStorage()">Check Storage</button>
    <button onclick="clearAuth()">Clear Auth</button>
    <button onclick="signIn()">Sign In</button>
  </div>
  
  <div class="section">
    <h3>Storage Contents:</h3>
    <pre id="output">Click "Check Storage" to see contents</pre>
  </div>

  <script>
    const output = document.getElementById('output');
    
    async function checkStorage() {
      const result = await chrome.storage.local.get(null);
      output.textContent = JSON.stringify(result, null, 2);
    }
    
    async function clearAuth() {
      await chrome.storage.local.remove(['authToken', 'user', 'googleAccessToken']);
      output.textContent = 'Auth data cleared';
    }
    
    async function signIn() {
      try {
        output.textContent = 'Signing in...';
        const response = await chrome.runtime.sendMessage({ action: 'signInWithGoogle' });
        output.textContent = 'Sign in result:\n' + JSON.stringify(response, null, 2);
      } catch (error) {
        output.textContent = 'Error: ' + error.message;
      }
    }
  </script>
</body>
</html>
